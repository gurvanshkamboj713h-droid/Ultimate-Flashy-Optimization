
name: Build Ultimate Flashy VPN

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Arrange source files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p src/main/java/com/ultimateflashy/vpn/mixin
          mkdir -p src/main/resources

          cp UltimateFlashyVPN.java src/main/java/com/ultimateflashy/vpn/
          cp ProxyTester.java src/main/java/com/ultimateflashy/vpn/
          cp VPNSettingsScreen.java src/main/java/com/ultimateflashy/vpn/
          cp ScreenAccessor.java src/main/java/com/ultimateflashy/vpn/mixin/
          cp fabric.mod.json src/main/resources/
          cp ultimate-flashy-vpn.mixins.json src/main/resources/

          cat > src/main/java/com/ultimateflashy/vpn/mixin/PauseScreenMixin.java <<'EOF'
          package com.ultimateflashy.vpn.mixin;

          import com.ultimateflashy.vpn.VPNSettingsScreen;
          import net.minecraft.client.Minecraft;
          import net.minecraft.client.gui.components.Button;
          import net.minecraft.client.gui.screens.PauseScreen;
          import net.minecraft.client.gui.screens.Screen;
          import net.minecraft.network.chat.Component;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;

          @Mixin(PauseScreen.class)
          public abstract class PauseScreenMixin {
              @Inject(method = "init", at = @At("TAIL"))
              private void ultimateFlashy$addSettingsButton(CallbackInfo ci) {
                  Screen parent = (Screen) (Object) this;
                  var window = Minecraft.getInstance().getWindow();
                  int guiWidth = window.getGuiScaledWidth();
                  int guiHeight = window.getGuiScaledHeight();

                  Button button = Button.builder(
                      Component.literal("✦ VPN Settings"),
                      ignored -> Minecraft.getInstance().setScreen(
                          new VPNSettingsScreen(parent))
                  ).bounds(guiWidth / 2 - 100,
                      guiHeight / 4 + 120, 200, 20).build();

                  ((ScreenAccessor) parent).ultimateFlashy$addWidget(button);
              }
          }
          EOF

      - name: Build mod
        run: gradle clean build --no-daemon

      - name: Collect mod JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find build/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-dev.jar' \
            ! -name '*-sources.jar' \
            -exec cp {} dist/ \;

          echo "JAR files prepared:"
          find dist -type f -name '*.jar' -print

          test -n "$(find dist -type f -name '*.jar' -print -quit)"

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate-Flashy-VPN-v0.3.1
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 14
          
