name: Ultimate Flashy VPN Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Fabric VPN Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Prepare source folders
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p src/main/java/com/ultimateflashy/vpn/mixin
          mkdir -p src/main/resources

          find . -maxdepth 1 -name '*.java' -exec cp {} src/main/java/com/ultimateflashy/vpn/ \;

          if [ -f ScreenAccessor.java ]; then
            mv src/main/java/com/ultimateflashy/vpn/ScreenAccessor.java src/main/java/com/ultimateflashy/vpn/mixin/
          fi

          cp fabric.mod.json src/main/resources/
          cp ultimate-flashy-vpn.mixins.json src/main/resources/

          echo "Java source files:"
          find src/main/java -type f -name '*.java'

      - name: Verify project files
        run: |
          test -f build.gradle
          test -f settings.gradle
          test -f gradle.properties
          test -f src/main/resources/fabric.mod.json
          test -f src/main/java/com/ultimateflashy/vpn/UltimateFlashyVPN.java

      - name: Build mod
        run: gradle clean build --no-daemon

      - name: Verify JAR
        run: |
          mkdir -p dist
          find build/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-dev.jar' \
            ! -name '*-sources.jar' \
            -exec cp {} dist/ \;
          test -n "$(find dist -name '*.jar' -print -quit)"
          ls -lh dist/

      - name: Upload downloadable mod
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate-Flashy-VPN
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 14
          
