name: Build Ultimate Flashy VPN

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"

      - name: Generate project
        shell: bash
        run: |
          mkdir -p src/main/java/com/ultimateflashy/vpn/gui
          mkdir -p src/main/java/com/ultimateflashy/vpn/mixin
          mkdir -p src/main/java/com/ultimateflashy/vpn/proxy
          mkdir -p src/main/resources

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven { url = "https://maven.fabricmc.net/" }
                  gradlePluginPortal()
                  mavenCentral()
              }
          }
          rootProject.name = "Ultimate-Flashy-VPN"
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3G
          minecraft_version=1.21.11
          loader_version=0.18.4
          loom_version=1.13.6
          fabric_api_version=0.141.6+1.21.11
          mod_version=0.3.0
          maven_group=com.ultimateflashy
          archives_base_name=ultimate-flashy-vpn
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'fabric-loom' version "${loom_version}"
          }

          version = project.mod_version
          group = project.maven_group

          base {
              archivesName = project.archives_base_name
          }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings loom.officialMojangMappings()
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
          }

          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") {
                  expand "version": version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              options.release = 21
          }

          java {
              toolchain {
                  languageVersion = JavaLanguageVersion.of(21)
              }
          }
          EOF

          cat > src/main/resources/fabric.mod.json <<'EOF'
          {
            "schemaVersion": 1,
            "id": "ultimate_flashy_vpn",
            "version": "${version}",
            "name": "Ultimate Flashy VPN",
            "description": "Minecraft proxy configuration and testing.",
            "environment": "client",
            "entrypoints": {
              "client": [
                "com.ultimateflashy.vpn.UltimateFlashyVPN"
              ]
            },
            "mixins": [
              "ultimate_flashy_vpn.mixins.json"
            ],
            "depends": {
              "fabricloader": ">=0.18.0",
              "fabric-api": "*",
              "minecraft": "1.21.11",
              "java": ">=21"
            }
          }
          EOF

          cat > src/main/resources/ultimate_flashy_vpn.mixins.json <<'EOF'
          {
            "required": true,
            "package": "com.ultimateflashy.vpn.mixin",
            "compatibilityLevel": "JAVA_21",
            "client": ["ScreenAccessor"],
            "injectors": {
              "defaultRequire": 1
            }
          }
          EOF

          cat > src/main/java/com/ultimateflashy/vpn/mixin/ScreenAccessor.java <<'EOF'
          package com.ultimateflashy.vpn.mixin;

          import net.minecraft.client.gui.components.Renderable;
          import net.minecraft.client.gui.components.events.GuiEventListener;
          import net.minecraft.client.gui.narration.NarratableEntry;
          import net.minecraft.client.gui.screens.Screen;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.gen.Invoker;

          @Mixin(Screen.class)
          public interface ScreenAccessor {
              @Invoker("addRenderableWidget")
              <T extends GuiEventListener & Renderable & NarratableEntry>
              T ultimateFlashy$addWidget(T widget);
          }
          EOF

          cat > src/main/java/com/ultimateflashy/vpn/UltimateFlashyVPN.java <<'EOF'
          package com.ultimateflashy.vpn;

          import com.ultimateflashy.vpn.gui.VPNSettingsScreen;
          import com.ultimateflashy.vpn.mixin.ScreenAccessor;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.screen.v1.ScreenEvents;
          import net.minecraft.client.gui.components.Button;
          import net.minecraft.client.gui.screens.PauseScreen;
          import net.minecraft.network.chat.Component;

          public final class UltimateFlashyVPN implements ClientModInitializer {
              @Override
              public void onInitializeClient() {
                  ScreenEvents.AFTER_INIT.register((client, screen, width, height) -> {
                      if (screen instanceof PauseScreen) {
                          Button button = Button.builder(
                              Component.literal("✦ VPN Settings"),
                              b -> client.setScreen(new VPNSettingsScreen(screen))
                          )
                          .bounds(width / 2 - 100, height / 4 + 120, 200, 20)
                          .build();

                          ((ScreenAccessor) screen).ultimateFlashy$addWidget(button);
                      }
                  });
              }
          }
          EOF

          cat > src/main/java/com/ultimateflashy/vpn/proxy/ProxyTester.java <<'EOF'
          package com.ultimateflashy.vpn.proxy;

          import java.io.BufferedInputStream;
          import java.io.ByteArrayOutputStream;
          import java.io.OutputStream;
          import java.net.InetSocketAddress;
          import java.net.Socket;
          import java.nio.charset.StandardCharsets;
          import java.util.Base64;

          public final class ProxyTester {
              private ProxyTester() {}

              public static String test(
                  String type,
                  String host,
                  int port,
                  String username,
                  String password
              ) {
                  long started = System.currentTimeMillis();

                  try (Socket socket = new Socket()) {
                      socket.connect(new InetSocketAddress(host, port), 6000);
                      socket.setSoTimeout(6000);

                      if ("SOCKS5".equals(type)) {
                          testSocks5(socket, host, username, password);
                      } else {
                          testHttpConnect(socket, host, port, username, password);
                      }

                      long elapsed = System.currentTimeMillis() - started;
                      return "Tunnel test successful! " + elapsed + " ms";
                  } catch (Exception e) {
                      return "Test failed: " +
                          (e.getMessage() == null ? e.getClass().getSimpleName() : e.getMessage());
                  }
              }

              private static void testSocks5(
                  Socket socket,
                  String proxyHost,
                  String username,
                  String password
              ) throws Exception {
                  OutputStream out = socket.getOutputStream();
                  BufferedInputStream in = new BufferedInputStream(socket.getInputStream());

                  boolean auth = !username.isEmpty();
                  out.write(auth
                      ? new byte[] {5, 1, 2}
                      : new byte[] {5, 1, 0});
                  out.flush();

                  int version = in.read();
                  int method = in.read();

                  if (version != 5 || method == 255 || method == -1) {
                      throw new Exception("SOCKS5 negotiation rejected");
                  }

                  if (method == 2) {
                      byte[] user = username.getBytes(StandardCharsets.UTF_8);
                      byte[] pass = password.getBytes(StandardCharsets.UTF_8);

                      if (user.length > 255 || pass.length > 255) {
                          throw new Exception("Credentials are too long");
                      }

                      out.write(1);
                      out.write(user.length);
                      out.write(user);
                      out.write(pass.length);
                      out.write(pass);
                      out.flush();

                      if (in.read() != 1 || in.read() != 0) {
                          throw new Exception("SOCKS5 authentication failed");
                      }
                  } else if (method != 0) {
                      throw new Exception("Unsupported SOCKS5 authentication method");
                  }

                  byte[] domain = "example.com".getBytes(StandardCharsets.US_ASCII);
                  out.write(new byte[] {5, 1, 0, 3, (byte) domain.length});
                  out.write(domain);
                  out.write(new byte[] {1, (byte) 187});
                  out.flush();

                  int ver = in.read();
                  int reply = in.read();
                  in.read();
                  int addressType = in.read();

                  if (ver != 5 || reply != 0) {
                      throw new Exception("SOCKS5 tunnel rejected: " + reply);
                  }

                  int addressLength;
                  if (addressType == 1) {
                      addressLength = 4;
                  } else if (addressType == 4) {
                      addressLength = 16;
                  } else if (addressType == 3) {
                      addressLength = in.read();
                  } else {
                      throw new Exception("Invalid SOCKS5 response");
                  }

                  for (int i = 0; i < addressLength + 2; i++) {
                      if (in.read() == -1) {
                          throw new Exception("Incomplete SOCKS5 response");
                      }
                  }
              }

              private static void testHttpConnect(
                  Socket socket,
                  String proxyHost,
                  int proxyPort,
                  String username,
                  String password
              ) throws Exception {
                  OutputStream out = socket.getOutputStream();
                  BufferedInputStream in = new BufferedInputStream(socket.getInputStream());

                  StringBuilder request = new StringBuilder();
                  request.append("CONNECT example.com:443 HTTP/1.1\r\n");
                  request.append("Host: example.com:443\r\n");

                  if (!username.isEmpty()) {
                      String credentials = username + ":" + password;
                      String encoded = Base64.getEncoder().encodeToString(
                          credentials.getBytes(StandardCharsets.UTF_8)
                      );
                      request.append("Proxy-Authorization: Basic ")
                          .append(encoded).append("\r\n");
                  }

                  request.append("Proxy-Connection: Keep-Alive\r\n\r\n");
                  out.write(request.toString().getBytes(StandardCharsets.US_ASCII));
                  out.flush();

                  ByteArrayOutputStream response = new ByteArrayOutputStream();
                  int matched = 0;
                  byte[] end = {13, 10, 13, 10};

                  while (response.size() < 16384) {
                      int value = in.read();
                      if (value == -1) {
                          break;
                      }
                      response.write(value);

                      if (value == end[matched]) {
                          matched++;
                          if (matched == 4) {
                              break;
                          }
                      } else {
                          matched = value == 13 ? 1 : 0;
                      }
                  }

                  String headers = response.toString(StandardCharsets.US_ASCII);
                  String firstLine = headers.split("\r\n", 2)[0];

                  if (!firstLine.matches("HTTP/\\d(?:\\.\\d)? 200(?: .*|$)")) {
                      throw new Exception("HTTP CONNECT rejected: " + firstLine);
                  }
              }
          }
          EOF

          cat > src/main/java/com/ultimateflashy/vpn/gui/VPNSettingsScreen.java <<'EOF'
          package com.ultimateflashy.vpn.gui;

          import com.google.gson.Gson;
          import com.google.gson.GsonBuilder;
          import com.ultimateflashy.vpn.proxy.ProxyTester;
          import net.minecraft.client.Minecraft;
          import net.minecraft.client.gui.GuiGraphics;
          import net.minecraft.client.gui.components.Button;
          import net.minecraft.client.gui.components.EditBox;
          import net.minecraft.client.gui.screens.Screen;
          import net.minecraft.network.chat.Component;

          import java.nio.file.Files;
          import java.nio.file.Path;

          public class VPNSettingsScreen extends Screen {
              private final Screen parent;
              private EditBox hostField;
              private EditBox portField;
              private EditBox userField;
              private EditBox passwordField;
              private String proxyType = "SOCKS5";
              private volatile String status = "Not connected";
              private static final Gson GSON = new GsonBuilder().setPrettyPrinting().create();

              public VPNSettingsScreen(Screen parent) {
                  super(Component.literal("Ultimate Flashy VPN"));
                  this.parent = parent;
              }

              private Path configPath() {
                  return Minecraft.getInstance().gameDirectory.toPath()
                      .resolve("config/ultimate-flashy-vpn.json");
              }

              private void loadProfile() {
                  try {
                      Path path = configPath();
                      if (Files.exists(path)) {
                          Profile p = GSON.fromJson(
                              Files.readString(path), Profile.class
                          );
                          if (p != null) {
                              proxyType = p.type == null ? "SOCKS5" : p.type;
                              hostField.setValue(p.host == null ? "" : p.host);
                              portField.setValue(p.port == null ? "1080" : p.port);
                              userField.setValue(p.username == null ? "" : p.username);
                              passwordField.setValue(p.password == null ? "" : p.password);
                          }
                      }
                  } catch (Exception e) {
                      status = "Could not load profile";
                  }
              }

              private void saveProfile() {
                  try {
                      Files.createDirectories(configPath().getParent());
                      Profile p = new Profile();
                      p.type = proxyType;
                      p.host = hostField.getValue();
                      p.port = portField.getValue();
                      p.username = userField.getValue();
                      p.password = passwordField.getValue();

                      Files.writeString(configPath(), GSON.toJson(p));
                      status = "Profile saved on this device";
                  } catch (Exception e) {
                      status = "Could not save profile";
                  }
              }

              private static class Profile {
                  String type;
                  String host;
                  String port;
                  String username;
                  String password;
              }

              @Override
              protected void init() {
                  int center = this.width / 2;
                  int fieldWidth = Math.min(240, this.width - 30);
                  int left = center - fieldWidth / 2;
                  int y = 48;

                  hostField = new EditBox(
                      this.font, left, y, fieldWidth, 20,
                      Component.literal("Proxy host")
                  );
                  hostField.setMaxLength(253);
                  hostField.setHint(Component.literal("proxy.example.com"));
                  this.addRenderableWidget(hostField);

                  portField = new EditBox(
                      this.font, left, y + 43, fieldWidth, 20,
                      Component.literal("Port")
                  );
                  portField.setMaxLength(5);
                  portField.setHint(Component.literal("1080"));
                  this.addRenderableWidget(portField);

                  userField = new EditBox(
                      this.font, left, y + 86, fieldWidth, 20,
                      Component.literal("Username")
                  );
                  userField.setMaxLength(255);
                  userField.setHint(Component.literal("Optional username"));
                  this.addRenderableWidget(userField);

                  passwordField = new EditBox(
                      this.font, left, y + 129, fieldWidth, 20,
                      Component.literal("Password")
                  );
                  passwordField.setMaxLength(255);
                  passwordField.setHint(Component.literal("Optional password"));
                  this.addRenderableWidget(passwordField);

                  this.addRenderableWidget(
                      Button.builder(
                          Component.literal("Type: " + proxyType + "  ↻"),
                          b -> {
                              proxyType = proxyType.equals("SOCKS5")
                                  ? "HTTP CONNECT" : "SOCKS5";
                              b.setMessage(Component.literal("Type: " + proxyType + "  ↻"));
                          }
                      )
                      .bounds(left, y + 172, fieldWidth, 20)
                      .build()
                  );

                  int half = (fieldWidth - 6) / 2;

                  this.addRenderableWidget(
                      Button.builder(
                          Component.literal("Save Profile"),
                          b -> saveProfile()
                      )
                      .bounds(left, y + 201, half, 20)
                      .build()
                  );

                  this.addRenderableWidget(
                      Button.builder(
                          Component.literal("Test Connection"),
                          b -> testProxy()
                      )
                      .bounds(left + half + 6, y + 201, half, 20)
                      .build()
                  );

                  this.addRenderableWidget(
                      Button.builder(
                          Component.literal("Back"),
                          b -> onClose()
                      )
                      .bounds(center - 100, this.height - 28, 200, 20)
                      .build()
                  );

                  loadProfile();
              }

              private void testProxy() {
                  String host = hostField.getValue().trim();
                  String portText = portField.getValue().trim();
                  String user = userField.getValue();
                  String pass = passwordField.getValue();
                  
